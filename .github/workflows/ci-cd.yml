name: CI/CD Pipeline - ProBiblio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Java (JDK 17, igual que tu Tomcat)
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Compilar el proyecto con Maven (equivale a tu clean package)
      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      # 4. Construir la imagen de Docker para verificar que todo empaquete bien
      - name: Construir contenedor Docker
        run: docker-compose build